name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  macos-helper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DictionaryHelper
        working-directory: native/macos/DictionaryHelper
        run: swift build -c release
      - name: Smoke test
        working-directory: native/macos/DictionaryHelper
        run: |
          .build/release/DictionaryHelper dictionary
          echo '{"id":1,"word":"serendipity"}' | .build/release/DictionaryHelper
